    <link rel="apple-touch-icon" sizes="76x76" href="lib/images/favicons/apple-touch-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="lib/images/favicons/apple-touch-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="lib/images/favicons/apple-touch-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="lib/images/favicons/apple-touch-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="lib/images/favicons/apple-touch-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="lib/images/favicons/apple-touch-icon-180x180.png">
    <link rel="icon" type="image/png" href="lib/images/favicons/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="lib/images/favicons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/png" href="lib/images/favicons/favicon-16x16.png" sizes="16x16">

    <script src="lib/javascripts/underscore.js"></script>
    <script src="lib/javascripts/keymaster.js"></script>

    <script src="lib/javascripts/movingObject.js"></script>
    <script src="lib/javascripts/asteroid.js"></script>
    <script src="lib/javascripts/bullet.js"></script>
    <script src="lib/javascripts/explosion.js"></script>
    <script src="lib/javascripts/ship.js"></script>
    <script src="lib/javascripts/ufo.js"></script>
    <script src="lib/javascripts/ufoBullet.js"></script>
    <script src="lib/javascripts/powerup.js"></script>
    <script src="lib/javascripts/game.js"></script>
    <script src="lib/javascripts/gameView.js"></script>
  </head>

  <body>
    <section id='container'>
      <section id='sidebar'>

        <section id='board'>

          <div id="modal-screen" class='show'>
            <div id="menu">
              <div id="menu-container">
                <h1 class="game-title">ASTEROIDS</h1>
                <!-- High Scores for Start Screen (Moved Inside) -->
                <div id="high-scores-start" class="high-scores-list"></div>
                <button id="start-game-btn" class="btn">Start Game</button>
              </div>
              <!-- High Scores Div removed from here -->
            </div>
          </div>


          <canvas id="game-canvas"></canvas>
          <div id="game-over" class='show hide'>
            <h2>Game Over</h2>
            <!-- High Scores for Game Over Screen -->
            <div id="high-scores-gameover" class="high-scores-list"></div>
            <button class='btn new-game-btn'>New Game</button>
          </div>
          <div id="level-display" class="centered-text hide">
            <h2 id="level-text">Level 1</h2>
          </div>
          <div id="countdown-display" class="centered-text hide">
            <h2 id="countdown-number">3</h2>
          </div>
        </section>

        <header>
          <h2>ASTEROIDS</h2>
          <img src="lib/images/asteroids_logo.jpg"/>
        </header>
        <section class='side-frame'>
          <h3>LEVEL</h3>
          <div id='level'>1</div>
        </section>
        <section class='side-frame'>
          <h3>SCORE</h3>
          <div id='score'>0</div>
        </section>
        <section class='side-frame'>
          <h3>LIVES</h3>
          <div id='lives'>5</div>
        </section>
        <button class='btn new-game-btn'>New Game</button>

        <!-- <h3 id='controls'>Controls</h3> -->
        <h4>Fire</h4>
        <h5 class='fire'>space bar</h5>
        <h4>Forward Thrust</h4>
        <h5 class='thrust'><i class="fa-solid fa-arrow-up"></i></h5>
        <h4>Backward Thrust</h4>
        <h5 class='thrust'><i class="fa-solid fa-arrow-down"></i></h5>
        <h4>Rotate Left</h4>
        <h5 class='turn arrow-left'><i class="fa-solid fa-arrow-left"></i></h5>
        <h4>Rotate Right</h4>
        <h5 class='turn arrow-right'><i class="fa-solid fa-arrow-right"></i></h5>
      </section>
    </section>

    <!-- Initials Input Modal (Initially Hidden) -->
    <div id="initials-input-modal" class="modal-overlay hide">
        <div class="modal-content">
            <h3>High Score!</h3>
            <p>Enter your initials:</p>
            <input type="text" id="initials-input" maxlength="3" autocomplete="off" spellcheck="false">
            <button id="submit-initials-btn" class="btn">Submit</button>
        </div>
    </div>

    <script>
      // Define Frame_Rate globally BEFORE other scripts load
      window.Frame_Rate = 2; 

      // Wrap game initialization in window.onload
      window.onload = function() {
        windowHeight = $(window).innerHeight();
        $('#sidebar').css('height', windowHeight - 5);
        $('#board').css('height', windowHeight - 5);

        windowWidth = $(window).innerWidth();
        $('#board').css('width', windowWidth - 205);

        var canvasEl = document.getElementById("game-canvas");
        canvasEl.height = $('#board').innerHeight();
        canvasEl.width = $('#board').innerWidth();
        var context = canvasEl.getContext("2d");
        
        // Initialize game AFTER all scripts are loaded
        window.currentGame = new Asteroids.Game(canvasEl.width, canvasEl.height);
        window.gameView = new Asteroids.GameView(context);
        // Start the attract mode loop immediately
        gameView.startAttractModeLoop();
        // Display high scores on initial load
        Asteroids.Util.displayHighScores('high-scores-start');

        // Add listener for the new start game button
        $('#start-game-btn').on('mouseup', function() {
            gameView.stopLoop(); // Stop the attract mode loop
            currentGame.startGameHandler(); // Setup game state and start countdown
            gameView.start(); // NOW start the main rendering/game loop
        });

        // Add listener for the initials submit button
        $('#submit-initials-btn').on('click', function() {
            const initials = $('#initials-input').val().toUpperCase(); // Ensure uppercase
            if (initials && initials.trim().length > 0 && initials.trim().length <= 3) {
                // Retrieve the score stored when the game over sequence began
                const finalScore = window.currentGame.finalScore; 

                let highScores = Asteroids.Util.loadHighScores();
                // Use the stored finalScore here
                highScores = Asteroids.Util.addHighScore(initials.trim(), finalScore, highScores);
                
                // Hide the initials modal.
                $('#initials-input-modal').addClass('hide');
                
                // Now, trigger the new game sequence to return to the start screen/attract mode.
                window.currentGame.newGame();

            } else {
                alert("Please enter 1 to 3 initials.");
            }
        });

      };
    </script>
    <script charset="utf-8"></script>
  </body>
</html>
